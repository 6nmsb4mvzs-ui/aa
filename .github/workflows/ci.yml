name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      all_cities:
        description: "Run the live discovery report for all test cities"
        type: boolean
        default: false
  schedule:
    # Weekly check that the free data sources still work as integrated.
    - cron: "17 5 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core unit tests (Linux, Swift 6.1)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the discovery core
        run: swift test --parallel

  live-sources:
    name: Live data sources (OSM, Wikidata, Commons, venue sites)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: swift:6.1
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Probe Overpass endpoints with curl (network diagnosis)
        run: |
          command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl >/dev/null)
          for ep in https://overpass-api.de/api https://overpass.private.coffee/api https://ovp.dresel.systems/api; do
            echo "== $ep/status"; curl -sS -m 15 -A "Sidestreet-CI/1.0 (https://github.com/)" "$ep/status" | head -8 || true
            curl -sS -m 45 -o /tmp/out.json -w "== $ep/interpreter -> HTTP %{http_code} in %{time_total}s, %{size_download} bytes\n" \
              -A "Sidestreet-CI/1.0 (https://github.com/)" \
              --data-urlencode 'data=[out:json][timeout:25][bbox:52.48,13.39,52.51,13.44];nwr["shop"="second_hand"];out center 50;' \
              "$ep/interpreter" || true
            head -c 300 /tmp/out.json || true; echo
          done
      - name: Run live integration tests and print discovery report
        env:
          LIVE_SOURCES: "1"
          LIVE_ALL_CITIES: ${{ github.event.inputs.all_cities == 'true' && '1' || '0' }}
        run: swift test --filter LiveSourcesTests

  ios:
    name: iOS app build + tests (Xcode)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check for Xcode project
        id: check
        run: |
          if [ -f Sidestreet.xcodeproj/project.pbxproj ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Select newest stable Xcode
        if: steps.check.outputs.exists == 'true'
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -viE "beta|release_candidate|_rc" | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: Pick and boot an iPhone simulator
        if: steps.check.outputs.exists == 'true'
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          best=None
          for runtime,devs in d.items():
              if 'iOS' not in runtime: continue
              for dev in devs:
                  if dev['name'].startswith('iPhone') and dev.get('isAvailable', True):
                      ver=runtime.split('iOS-')[-1]
                      key=tuple(int(x) for x in ver.split('-') if x.isdigit())
                      if best is None or key>best[0]: best=(key,dev['udid'],dev['name'],runtime)
          print(best[1]); print(best[2], best[3], file=sys.stderr)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Build app (no signing)
        if: steps.check.outputs.exists == 'true'
        run: |
          set -o pipefail
          xcodebuild -project Sidestreet.xcodeproj -scheme Sidestreet \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO build | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Run unit tests on simulator
        if: steps.check.outputs.exists == 'true'
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild -project Sidestreet.xcodeproj -scheme Sidestreet \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -test-timeouts-enabled YES -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test.log | grep --line-buffered -E "error:|Test Case.*(started|failed)|Executed|TEST|Testing" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Upload logs
        if: always() && steps.check.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: "*.log"
